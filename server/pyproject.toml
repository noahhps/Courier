[project]
name = "unified-llm-server"
version = "0.1.0"
description = "Personal LLM server: one memory, one history, on your own hardware"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    # Attachments. Pillow re-encodes formats the local runner refuses and
    # flattens transparency; pypdf is the one document format that needs a
    # real parser, the Office and OpenDocument ones being ZIPs of XML that
    # extract.py reads with the standard library.
    "pillow>=10.0",
    "pypdf>=4.0",
    # Windows ships no system timezone database, so zoneinfo cannot resolve
    # an IANA name without this. Harmless everywhere else.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Cloud fallback. Not needed for a purely local install.
cloud = ["anthropic>=0.69"]

[project.scripts]
unified-llm = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
